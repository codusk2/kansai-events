n:0;padding:14px 0;border-top:1px solid var(--line);font-size:.84rem}.detail dt{color:var(--muted)}.detail dd{margin:0;overflow-wrap:anywhere}.bottomline{display:flex;gap:12px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:15px}.pick-label{display:inline-flex;gap:9px;align-items:center;font-size:.85rem;cursor:pointer}.pick-label input{width:18px;height:18px;accent-color:var(--accent)}.official{text-decoration:none;font-size:.86rem;font-weight:650}.official:hover{text-decoration:underline}.empty{grid-column:1/-1;text-align:center;padding:70px 10px;color:var(--muted)}

<body>
<header><div class="wrap masthead"><div><div class="eyebrow">Kansai · Event Atlas</div><h1>南瓜去遛弯<span aria-hidden="true">.</span></h1><p class="lede">展览、艺术与城市里的有趣现场。先看海报，再决定去哪。</p></div><div class="header-right"><span class="counter" id="total">活动精选</span><button id="theme" class="subtle-button" type="button" aria-label="切换明暗模式">明暗模式</button></div></div></header>
<div class="wrap"><div class="toolbar"><div class="filters"><div class="field"><label for="region">地区</label><select id="region"><option value="">全部地区</option></select></div><div class="field"><label for="type">类型</label><select id="type"><option value="">全部类型</option></select></div><div class="field"><label for="sort">排序</label><select id="sort"><option value="importance">规模 / 重要度</option><option value="date">日期（进行中优先）</option><option value="rating">推荐指数</option></select></div></div><div class="tool-right"><span class="summary" id="summary"></span><button class="subtle-button select-visible" id="select-visible" type="button">选中当前结果</button></div></div><section class="track-section" aria-label="我在追踪"><div class="section-title"><h2><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 17l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8z"/></svg>我在追踪</h2><small id="track-count"></small></div><div class="tracking" id="tracking"></div></section><main class="grid" id="grid"></main><div class="footer">海报及活动信息版权归各活动主办方。请以官方公布的时间、门票及预约要求为准。</div></div>
<div class="bottom-bar" id="bottom-bar" hidden><div class="wrap bar-inner"><div class="bar-left"><span class="bar-count" id="selected-count">已选 0 项</span><button class="link-button" id="clear" type="button">清空</button></div><button class="primary" id="copy" type="button">复制选中的活动</button></div></div>
<div id="toast" role="status" aria-live="polite" hidden></div><div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="海报原图" hidden><button class="lightbox-close" type="button" id="close-lightbox" aria-label="关闭灯箱">×</button><img id="lightbox-image" alt=""></div>
<script id="event-data" type="application/json">__EVENTS_JSON__</script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const data=JSON.parse($('event-data').textContent);
const events=Array.isArray(data)?data:[];
const storeKey='pumpkin-events-v2:'+location.pathname;
const unreadableKeys=new Set();
const safeRead=(key,fallback)=>{try{const raw=localStorage.getItem(key);if(raw===null)return fallback;const v=JSON.parse(raw);const valid=key.endsWith(':stars')||key.endsWith(':selected')?Array.isArray(v)&&v.every(id=>typeof id==='string'):key.endsWith(':settings')?v!==null&&typeof v==='object'&&!Array.isArray(v):['auto','light','dark'].includes(v);if(!valid)throw new Error('invalid archive');return v}catch{unreadableKeys.add(key);return fallback}};
const safeWrite=(key,value)=>{if(unreadableKeys.has(key)){toast('本机存档异常，已保留原文；请先备份并核对。');return false}try{localStorage.setItem(key,JSON.stringify(value));return true}catch{toast('无法保存到本机，请检查存储权限并备份。');return false}};
const known=new Set(events.map(x=>x.id));
const selected=new Set((safeRead(storeKey+':selected',[])||[]).filter(id=>typeof id==='string'));
const stars=new Set((safeRead(storeKey+':stars',null)||events.filter(x=>x.追踪).map(x=>x.id)).filter(id=>typeof id==='string'));
const settings=safeRead(storeKey+':settings',{})||{};
const elem=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=String(text);return e};
const addText=(parent,tag,cls,text)=>{const e=elem(tag,cls,text);parent.append(e);return e};
const pad=n=>String(n).padStart(2,'0');const _t=new Date();const today=_t.getFullYear()+'-'+pad(_t.getMonth()+1)+'-'+pad(_t.getDate());
const startOf=x=>x.开始日||(String(x.开始日期||'').match(/\d{4}-\d{2}-\d{2}/)||[''])[0];const endOf=x=>x.结束日||'';
const status=x=>{const s=startOf(x),e=endOf(x);if(e&&e<today)return 'ended';if((s&&s<=today)||(!s&&e))return 'ongoing';return s?'upcoming':'unknown'};
const dateValue=x=>startOf(x)||'9999-12-31';
const dateKey=x=>{const st=status(x);return st==='ongoing'?'0'+(endOf(x)||'9999-12-31'):st==='upcoming'?'1'+startOf(x):st==='unknown'?'2':'3'+(endOf(x)||'')};
const STAR_SVG='<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 17l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8z"/></svg>';
const starIcon=()=>{const t=document.createElement('template');t.innerHTML=STAR_SVG;return t.content.firstChild};
const importance=x=>x.排名?1000-Number(x.排名):(Number(x.规模重要度??x['规模/重要度']??0)||0);
const score=x=>{const v=x.推荐指数;if(v===null||v===undefined||v==='')return 0;const n=Math.round(Number(v));return n>=1&&n<=5?n:0};
function persist(){safeWrite(storeKey+':selected',[...selected]);safeWrite(storeKey+':stars',[...stars])}
function optionize(id,values){values.sort((a,b)=>a.localeCompare(b,'zh-CN'));values.forEach(v=>{const opt=elem('option','',v);opt.value=v;$(id).append(opt)})}
optionize('region',[...new Set(events.map(x=>x.地区).filter(Boolean))]);
optionize('type',[...new Set(events.flatMap(x=>Array.isArray(x.类型)?x.类型:[x.类型]).filter(Boolean))]);
['region','type','sort'].forEach(id=>{if(settings[id]&&[...$(id).options].some(o=>o.value===settings[id]))$(id).value=settings[id];$(id).addEventListener('change',render)});
const savedTheme=safeRead(storeKey+':theme','auto');document.documentElement.dataset.theme=['auto','light','dark'].includes(savedTheme)?savedTheme:'auto';
$('theme').addEventListener('click',()=>{const current=document.documentElement.dataset.theme;const next=current==='auto'?'dark':current==='dark'?'light':'auto';document.documentElement.dataset.theme=next;safeWrite(storeKey+':theme',next);updateTheme()});
function updateTheme(){$('theme').textContent='主题：'+({auto:'跟随系统',light:'浅色',dark:'深色'}[document.documentElement.dataset.theme]||'跟随系统')};updateTheme();
function matches(x){return (!$('region').value||x.地区===$('region').value)&&(!$('type').value||(Array.isArray(x.类型)?x.类型:[x.类型]).includes($('type').value))}
function ordered(){const out=events.filter(matches);const mode=$('sort').value;out.sort((a,b)=>mode==='date'?dateKey(a).localeCompare(dateKey(b))||importance(b)-importance(a):mode==='rating'?(score(b)||-1)-(score(a)||-1)||importance(b)-importance(a):importance(b)-importance(a)||dateValue(a).localeCompare(dateValue(b)));return out}
function detail(parent,label,value){if(value===undefined||value===null||value==='')return;addText(parent,'dt','',label);addText(parent,'dd','',Array.isArray(value)?value.join('、'):value)}
function card(x){const article=elem('article','event');article.id='event-'+x.id;const media=elem('div','poster-shell');
if(x.海报数据){const btn=elem('button','poster-button');btn.type='button';btn.setAttribute('aria-label','查看原尺寸海报：'+x.活动名);const img=elem('img','poster');img.src=x.海报数据;img.alt=x.活动名+' 活动海报';img.loading='lazy';btn.append(img);btn.addEventListener('click',()=>openLightbox(img.src,img.alt));media.append(btn);addText(media,'span','poster-hint','点击看原图')}else{const mp=addText(media,'div','missing-poster compact');addText(mp,'span','mp-tag','海报待补')}
const mode=$('sort').value;const st=status(x);const badgeText=mode==='rating'?(score(x)?`推荐 ${score(x)}/5`:''):mode==='date'?(st==='ongoing'?(endOf(x)?`进行中 · 至 ${+endOf(x).slice(5,7)}/${+endOf(x).slice(8)}`:'进行中'):(startOf(x)?`${+startOf(x).slice(5,7)}/${+startOf(x).slice(8)} 开始`:'')):(x.排名?`规模 #${x.排名}`:(x.规模重要度?`重要度 ${x.规模重要度}/5`:''));const badge=addText(media,'span','rank',badgeText);badge.title=mode==='rating'?'推荐指数':mode==='date'?'日期':'按规模/分量排序';if(!badgeText)badge.remove();
const star=elem('button','star');star.append(starIcon());star.type='button';star.setAttribute('aria-label','追踪：'+x.活动名);star.setAttribute('aria-pressed',stars.has(x.id)?'true':'false');star.addEventListener('click',()=>{stars.has(x.id)?stars.delete(x.id):stars.add(x.id);persist();render()});media.append(star);article.append(media);
const info=elem('div','info');const topline=elem('div','topline');addText(topline,'span','pill',x.地区||'未分类');(Array.isArray(x.类型)?x.类型:[x.类型]).filter(Boolean).forEach(t=>addText(topline,'span','pill',t));if(st==='ongoing')addText(topline,'span','status','进行中');if(score(x))addText(topline,'span','',`推荐 ${score(x)}/5`);info.append(topline);
addText(info,'h3','',x.活动名);addText(info,'p','lead',x.日期||'日期待定');addText(info,'p','description',x.简介||'');const dl=elem('dl','detail');detail(dl,'地点',x.地点);detail(dl,'门票',x.门票);detail(dl,'预计时长',x.预计时长);detail(dl,'交通',x.交通);detail(dl,'亮点',x.亮点);detail(dl,'提醒',x.提醒);info.append(dl);
const bottom=elem('div','bottomline');const label=elem('label','pick-label');const check=elem('input');check.type='checkbox';check.checked=selected.has(x.id);check.setAttribute('aria-label','选择活动 '+x.活动名);check.addEventListener('change',()=>{check.checked?selected.add(x.id):selected.delete(x.id);persist();updateCount()});label.append(check);addText(label,'span','','选择活动');bottom.append(label);
if(x.官网链接){const link=elem('a','official','官方网站 ↗');link.href=x.官网链接;link.target='_blank';link.rel='noopener noreferrer';bottom.append(link)}info.append(bottom);article.append(info);return article}
function tracking(){const host=$('tracking');host.replaceChildren();const tracked=events.filter(x=>stars.has(x.id));$('track-count').textContent=tracked.length+' 项';if(!tracked.length){addText(host,'p','track-empty','点击卡片右上角的星标，把想去的活动收进这里。');return}tracked.forEach(x=>{const a=elem('a','track-item');a.href='#event-'+x.id;a.addEventListener('click',()=>{if(!matches(x)){$('region').value='';$('type').value='';render()}});if(x.海报数据){const im=elem('img');im.src=x.海报数据;im.alt='';im.loading='lazy';a.append(im)}else{addText(a,'div','track-fallback',(x.日期||'海报待补').slice(0,12))}const words=elem('div');addText(words,'b','',x.活动名);addText(words,'small','',x.日期||'');a.append(words);host.append(a)})}
function updateCount(){$('selected-count').textContent='已选 '+selected.size+' 项';const bar=$('bottom-bar'),on=selected.size>0;bar.hidden=!on;document.body.classList.toggle('has-bar',on);document.documentElement.style.setProperty('--bar-h',on?bar.offsetHeight+'px':'0px')}
function trackFade(){const t=$('tracking');t.classList.toggle('at-end',t.scrollLeft+t.clientWidth>=t.scrollWidth-4)}
function render(){const arr=ordered();const host=$('grid');host.replaceChildren();arr.forEach(x=>host.append(card(x)));if(!arr.length)addText(host,'div','empty','没有匹配的活动。可以调整地区或类型。');$('summary').textContent='显示 '+arr.length+' / '+events.length+' 项';$('total').textContent=events.length+' EVENTS';['region','type','sort'].forEach(k=>settings[k]=$(k).value);safeWrite(storeKey+':settings',settings);tracking();updateCount();trackFade()}
$('select-visible').addEventListener('click',()=>{ordered().forEach(x=>selected.add(x.id));persist();render()});$('clear').addEventListener('click',()=>{selected.clear();persist();render()});
window.addEventListener('resize',()=>{updateCount();trackFade()});setTimeout(()=>$('tracking').addEventListener('scroll',trackFade,{passive:true}));let toastTimer;function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,2500)}
function legacyCopy(text){const area=elem('textarea');area.value=text;area.readOnly=true;area.style.cssText='position:fixed;top:0;left:0;opacity:0;width:1px;height:1px;';document.body.append(area);area.focus();area.select();area.setSelectionRange(0,text.length);let ok=false;try{ok=document.execCommand('copy')}catch{}area.remove();return ok}
$('copy').addEventListener('click',async()=>{const names=ordered().concat(events.filter(x=>!matches(x))).filter(x=>selected.has(x.id)).map(x=>[x.活动名,x.日期||'',x.地区||'',x.官网链接||''].join('｜'));if(!names.length){toast('请先勾选活动');return}const text=names.join('\n');let success=false;if(navigator.clipboard&&window.isSecureContext){try{await navigator.clipboard.writeText(text);success=true}catch{}}if(!success)success=legacyCopy(text);if(success){toast('已复制 '+names.length+' 项活动')}else{const area=elem('textarea');area.value=text;area.style.cssText='width:100%;min-height:100px;margin:10px 0';const modal=$('lightbox');$('lightbox-image').hidden=true;modal.insertBefore(area,$('lightbox-image'));modal.hidden=false;area.focus();area.select();toast('自动复制失败，请手动复制选中的文字')}});
let previousFocus=null;function openLightbox(src,alt){previousFocus=document.activeElement;$('lightbox-image').hidden=false;$('lightbox-image').src=src;$('lightbox-image').alt=alt;$('lightbox').hidden=false;document.body.style.overflow='hidden';$('close-lightbox').focus()}
function closeLightbox(){const modal=$('lightbox');modal.hidden=true;modal.querySelectorAll('textarea').forEach(x=>x.remove());$('lightbox-image').hidden=false;$('lightbox-image').removeAttribute('src');document.body.style.overflow='';if(previousFocus&&previousFocus.isConnected)previousFocus.focus()}
$('close-lightbox').addEventListener('click',closeLightbox);$('lightbox').addEventListener('click',e=>{if(e.target===$('lightbox'))closeLightbox()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('lightbox').hidden)closeLightbox()});
render();
})();
