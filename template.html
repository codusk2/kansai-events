<!doctype html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>南瓜遛弯 · 活动图鉴</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic","PingFang SC","Microsoft YaHei",sans-serif;color-scheme:light;--bg:#f2eadd;--panel:#fbf8f2;--ink:#302e28;--muted:#716d61;--line:#d8cbb8;--accent:#687554;--accent-ink:#fff;--chip:#e9e1d5;--shadow:0 12px 34px #51473512;--backdrop:#161814eF}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#20241f;--panel:#2b302a;--ink:#eee9df;--muted:#bbb7a8;--line:#4c544a;--accent:#a7bd90;--accent-ink:#1d261c;--chip:#363f34;--shadow:0 12px 34px #0004}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#20241f;--panel:#2b302a;--ink:#eee9df;--muted:#bbb7a8;--line:#4c544a;--accent:#a7bd90;--accent-ink:#1d261c;--chip:#363f34;--shadow:0 12px 34px #0004}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{background:var(--bg);color:var(--ink);margin:0;line-height:1.65}button,select{font:inherit}button{cursor:pointer}a{color:var(--accent)}button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1320px;margin:auto;padding:0 30px}header{padding:51px 0 25px;border-bottom:1px solid var(--line)}.masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}.eyebrow{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:750}.masthead h1{font-family:Georgia,"Yu Mincho","Hiragino Mincho ProN","Songti SC",serif;font-size:clamp(2.2rem,4.6vw,4.6rem);font-weight:500;line-height:1.17;letter-spacing:-.04em;margin:10px 0}.lede{color:var(--muted);margin:0;font-size:.98rem}.header-right{display:flex;align-items:center;gap:9px}.counter{font-size:.82rem;color:var(--muted);white-space:nowrap}.subtle-button{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 12px;border-radius:100px}
.toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding-top:22px;padding-bottom:20px}.filters{display:flex;flex-wrap:wrap;gap:8px}.field{display:flex;align-items:center;gap:8px;padding:8px 11px;background:var(--panel);border:1px solid var(--line);border-radius:11px}.field label{font-size:.76rem;color:var(--muted);white-space:nowrap}.field select{background:transparent;border:0;color:var(--ink);max-width:170px;outline:0;font-size:.88rem}.summary{color:var(--muted);font-size:.81rem}
.track-section{margin:5px 0 28px}.section-title{display:flex;align-items:baseline;gap:14px;margin-bottom:13px}.section-title h2{font-size:1.04rem;letter-spacing:.015em;margin:0}.section-title small{color:var(--muted)}.tracking{display:flex;gap:12px;overflow-x:auto;scrollbar-width:thin;padding-bottom:8px}.track-item{display:flex;align-items:center;gap:10px;min-width:230px;max-width:310px;flex:0 0 auto;padding:7px 11px 7px 7px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);text-decoration:none}.track-item img,.track-fallback{width:52px;height:58px;object-fit:contain;background:var(--chip);border-radius:7px}.track-fallback{display:grid;place-items:center;color:var(--muted)}.track-item b{display:block;font-size:.79rem;line-height:1.35}.track-item small{display:block;font-size:.73rem;color:var(--muted);margin-top:4px}.track-empty{color:var(--muted);font-size:.85rem;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:23px;align-items:start;margin:8px 0 60px}.event{background:var(--panel);border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:var(--shadow);min-width:0;scroll-margin-top:12px}.poster-shell{position:relative;background:var(--chip);display:flex;justify-content:center;align-items:center;min-height:260px}.poster-button{display:flex;justify-content:center;align-items:center;border:0;background:transparent;padding:0;width:100%;min-height:260px;cursor:zoom-in}.poster{width:100%;height:auto;max-height:520px;object-fit:contain;display:block}.missing-poster{height:275px;width:100%;display:grid;place-items:center;padding:25px;font-family:Georgia,"Yu Mincho",serif;color:var(--muted);text-align:center;letter-spacing:.1em}.poster-hint{position:absolute;right:14px;bottom:13px;background:#171916c9;color:white;padding:5px 10px;border-radius:99px;font-size:.73rem;pointer-events:none}.rank{position:absolute;top:14px;left:14px;z-index:1;background:#f5f0e9ea;color:#35402e;border-radius:9px;padding:5px 9px;font-size:.75rem;font-weight:750}.star{position:absolute;top:13px;right:13px;z-index:2;border:1px solid #eee5d4c7;border-radius:99px;background:#f7f3eaeF;color:#55594c;min-width:41px;height:41px;font-size:1.25rem;line-height:1}.star[aria-pressed="true"]{background:#687554;color:white}.info{padding:23px 25px 24px}.topline{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:.78rem}.pill{border:1px solid var(--line);border-radius:99px;padding:2px 9px;background:var(--chip);font-size:.73rem}.event h3{font-size:clamp(1.18rem,1.75vw,1.5rem);line-height:1.43;margin:11px 0 7px;letter-spacing:-.025em;overflow-wrap:anywhere}.lead{color:var(--accent);font-size:.85rem;font-weight:650;margin:0 0 13px}.description{margin:0 0 18px;font-size:.88rem;color:var(--ink);line-height:1.85;white-space:pre-line}.detail{display:grid;grid-template-columns:82px minmax(0,1fr);gap:6px 10px;margin:0;padding:14px 0;border-top:1px solid var(--line);font-size:.84rem}.detail dt{color:var(--muted)}.detail dd{margin:0;overflow-wrap:anywhere}.bottomline{display:flex;gap:12px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:15px}.pick-label{display:inline-flex;gap:9px;align-items:center;font-size:.85rem;cursor:pointer}.pick-label input{width:18px;height:18px;accent-color:var(--accent)}.official{text-decoration:none;font-size:.86rem;font-weight:650}.official:hover{text-decoration:underline}.empty{grid-column:1/-1;text-align:center;padding:70px 10px;color:var(--muted)}
.bottom-bar{position:sticky;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -7px 24px #00000014;padding:12px 0 calc(12px + env(safe-area-inset-bottom))}.bar-inner{display:flex;align-items:center;justify-content:space-between;gap:15px}.bar-left{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.bar-count{font-size:.84rem;color:var(--muted)}.primary{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:10px;padding:12px 20px}.primary:disabled{opacity:.45;cursor:not-allowed}.link-button{border:0;background:transparent;color:var(--muted);font-size:.82rem;text-decoration:underline}.footer{padding:20px 0 35px;color:var(--muted);font-size:.75rem}
#toast{position:fixed;left:50%;bottom:95px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 17px;border-radius:12px;z-index:30;font-size:.82rem;box-shadow:var(--shadow)}#toast[hidden]{display:none}
.lightbox{position:fixed;inset:0;z-index:20;background:#10120ff2;display:flex;align-items:center;justify-content:center;padding:55px 30px 25px}.lightbox[hidden]{display:none}.lightbox img{max-width:100%;max-height:100%;object-fit:contain}.lightbox-close{position:absolute;right:18px;top:15px;background:#f6f2e8;color:#293022;border:0;border-radius:50%;width:42px;height:42px;font-size:1.4rem}
@media(max-width:720px){.wrap{padding:0 16px}header{padding:30px 0 21px}.masthead{align-items:flex-start}.masthead h1{font-size:2.4rem}.header-right{flex-direction:column;align-items:flex-end}.toolbar{align-items:stretch}.filters{width:100%}.field{flex:1;min-width:125px}.field select{width:100%}.grid{grid-template-columns:1fr;gap:17px}.poster-shell,.poster-button{min-height:160px}.poster{max-height:500px}.info{padding:19px}.bar-inner{gap:8px}.primary{padding:11px 13px;font-size:.83rem}.bar-left{gap:8px}.bar-count{font-size:.76rem}.track-item{min-width:205px}.lightbox{padding:62px 8px 15px}}
@media(prefers-reduced-motion:no-preference){.event{transition:transform .2s,box-shadow .2s}.event:hover{transform:translateY(-2px)}}
</style>
</head>
<body>
<header><div class="wrap masthead"><div><div class="eyebrow">Kansai · Event Atlas</div><h1>南瓜去遛弯<span aria-hidden="true">.</span></h1><p class="lede">展览、艺术与城市里的有趣现场。先看海报，再决定去哪。</p></div><div class="header-right"><span class="counter" id="total">活动精选</span><button id="theme" class="subtle-button" type="button" aria-label="切换明暗模式">明暗模式</button></div></div></header>
<div class="wrap"><div class="toolbar"><div class="filters"><div class="field"><label for="region">地区</label><select id="region"><option value="">全部地区</option></select></div><div class="field"><label for="type">类型</label><select id="type"><option value="">全部类型</option></select></div><div class="field"><label for="sort">排序</label><select id="sort"><option value="importance">规模 / 重要度</option><option value="date">日期（近期优先）</option><option value="rating">推荐指数</option></select></div></div><span class="summary" id="summary"></span></div><section class="track-section" aria-label="我在追踪"><div class="section-title"><h2>⭐ 我在追踪</h2><small id="track-count"></small></div><div class="tracking" id="tracking"></div></section><main class="grid" id="grid"></main><div class="footer">海报及活动信息版权归各活动主办方。请以官方公布的时间、门票及预约要求为准。</div></div>
<div class="bottom-bar"><div class="wrap bar-inner"><div class="bar-left"><span class="bar-count" id="selected-count">已选 0 项</span><button class="link-button" id="select-visible" type="button">选中当前结果</button><button class="link-button" id="clear" type="button">清空</button></div><button class="primary" id="copy" type="button">复制选中的活动名</button></div></div>
<div id="toast" role="status" aria-live="polite" hidden></div><div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="海报原图" hidden><button class="lightbox-close" type="button" id="close-lightbox" aria-label="关闭灯箱">×</button><img id="lightbox-image" alt=""></div>
<script id="event-data" type="application/json">__EVENTS_JSON__</script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const data=JSON.parse($('event-data').textContent);
const events=Array.isArray(data)?data:[];
const storeKey='pumpkin-events-v2:'+location.pathname;
const safeRead=(key,fallback)=>{try{const v=JSON.parse(localStorage.getItem(key));return v===null?fallback:v}catch{return fallback}};
const safeWrite=(key,value)=>{try{localStorage.setItem(key,JSON.stringify(value))}catch{}};
const known=new Set(events.map(x=>x.id));
const selected=new Set((safeRead(storeKey+':selected',[])||[]).filter(id=>known.has(id)));
const stars=new Set((safeRead(storeKey+':stars',null)||events.filter(x=>x.追踪).map(x=>x.id)).filter(id=>known.has(id)));
const settings=safeRead(storeKey+':settings',{})||{};
const elem=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=String(text);return e};
const addText=(parent,tag,cls,text)=>{const e=elem(tag,cls,text);parent.append(e);return e};
const dateValue=x=>{const d=String(x.开始日期||x.日期||'').match(/\d{4}-\d{2}-\d{2}/);return d?d[0]:'9999-12-31'};
const importance=x=>x.排名?1000-Number(x.排名):(Number(x.规模重要度??x['规模/重要度']??0)||0);
const score=x=>{const n=Number(x.推荐指数);return n?Math.max(1,Math.min(5,n)):0};
function persist(){safeWrite(storeKey+':selected',[...selected]);safeWrite(storeKey+':stars',[...stars])}
function optionize(id,values){values.sort((a,b)=>a.localeCompare(b,'zh-CN'));values.forEach(v=>{const opt=elem('option','',v);opt.value=v;$(id).append(opt)})}
optionize('region',[...new Set(events.map(x=>x.地区).filter(Boolean))]);
optionize('type',[...new Set(events.flatMap(x=>Array.isArray(x.类型)?x.类型:[x.类型]).filter(Boolean))]);
['region','type','sort'].forEach(id=>{if(settings[id]&&[...$(id).options].some(o=>o.value===settings[id]))$(id).value=settings[id];$(id).addEventListener('change',render)});
const savedTheme=safeRead(storeKey+':theme','auto');document.documentElement.dataset.theme=['auto','light','dark'].includes(savedTheme)?savedTheme:'auto';
$('theme').addEventListener('click',()=>{const current=document.documentElement.dataset.theme;const next=current==='auto'?'dark':current==='dark'?'light':'auto';document.documentElement.dataset.theme=next;safeWrite(storeKey+':theme',next);updateTheme()});
function updateTheme(){$('theme').textContent='主题：'+({auto:'跟随系统',light:'浅色',dark:'深色'}[document.documentElement.dataset.theme]||'跟随系统')};updateTheme();
function matches(x){return (!$('region').value||x.地区===$('region').value)&&(!$('type').value||(Array.isArray(x.类型)?x.类型:[x.类型]).includes($('type').value))}
function ordered(){const out=events.filter(matches);const mode=$('sort').value;out.sort((a,b)=>mode==='date'?dateValue(a).localeCompare(dateValue(b))||importance(b)-importance(a):mode==='rating'?score(b)-score(a)||importance(b)-importance(a):importance(b)-importance(a)||dateValue(a).localeCompare(dateValue(b)));return out}
function detail(parent,label,value){if(value===undefined||value===null||value==='')return;addText(parent,'dt','',label);addText(parent,'dd','',Array.isArray(value)?value.join('、'):value)}
function card(x){const article=elem('article','event');article.id='event-'+x.id;const media=elem('div','poster-shell');
if(x.海报数据){const btn=elem('button','poster-button');btn.type='button';btn.setAttribute('aria-label','查看原尺寸海报：'+x.活动名);const img=elem('img','poster');img.src=x.海报数据;img.alt=x.活动名+' 活动海报';img.loading='lazy';btn.append(img);btn.addEventListener('click',()=>openLightbox(img.src,img.alt));media.append(btn);addText(media,'span','poster-hint','点击看原图')}else{addText(media,'div','missing-poster','POSTER COMING SOON')}
const badge=addText(media,'span','rank',x.排名?`规模 #${x.排名}`:(x.规模重要度?`重要度 ${x.规模重要度}/5`:''));if(!badge.textContent)badge.remove();badge.title='按规模/分量排序';
const star=elem('button','star',stars.has(x.id)?'★':'☆');star.type='button';star.setAttribute('aria-label','追踪：'+x.活动名);star.setAttribute('aria-pressed',stars.has(x.id)?'true':'false');star.addEventListener('click',()=>{stars.has(x.id)?stars.delete(x.id):stars.add(x.id);persist();render()});media.append(star);article.append(media);
const info=elem('div','info');const topline=elem('div','topline');addText(topline,'span','pill',x.地区||'未分类');(Array.isArray(x.类型)?x.类型:[x.类型]).filter(Boolean).forEach(t=>addText(topline,'span','pill',t));if(score(x))addText(topline,'span','',`推荐 ${'★'.repeat(score(x))}${'☆'.repeat(5-score(x))}`);info.append(topline);
addText(info,'h3','',x.活动名);addText(info,'p','lead',x.日期||'日期待定');addText(info,'p','description',x.简介||'');const dl=elem('dl','detail');detail(dl,'地点',x.地点);detail(dl,'门票',x.门票);detail(dl,'预计时长',x.预计时长);detail(dl,'交通',x.交通);detail(dl,'亮点',x.亮点);detail(dl,'提醒',x.提醒);info.append(dl);
const bottom=elem('div','bottomline');const label=elem('label','pick-label');const check=elem('input');check.type='checkbox';check.checked=selected.has(x.id);check.setAttribute('aria-label','选择活动 '+x.活动名);check.addEventListener('change',()=>{check.checked?selected.add(x.id):selected.delete(x.id);persist();updateCount()});label.append(check);addText(label,'span','','选择活动');bottom.append(label);
if(x.官网链接){const link=elem('a','official','官方网站 ↗');link.href=x.官网链接;link.target='_blank';link.rel='noopener noreferrer';bottom.append(link)}info.append(bottom);article.append(info);return article}
function tracking(){const host=$('tracking');host.replaceChildren();const tracked=events.filter(x=>stars.has(x.id));$('track-count').textContent=tracked.length+' 项';if(!tracked.length){addText(host,'p','track-empty','点击卡片右上角 ☆，把想去的活动收进这里。');return}tracked.forEach(x=>{const a=elem('a','track-item');a.href='#event-'+x.id;a.addEventListener('click',()=>{if(!matches(x)){$('region').value='';$('type').value='';render()}});if(x.海报数据){const im=elem('img');im.src=x.海报数据;im.alt='';im.loading='lazy';a.append(im)}else{addText(a,'div','track-fallback','☆')}const words=elem('div');addText(words,'b','',x.活动名);addText(words,'small','',x.日期||'');a.append(words);host.append(a)})}
function updateCount(){$('selected-count').textContent='已选 '+selected.size+' 项'}
function render(){const arr=ordered();const host=$('grid');host.replaceChildren();arr.forEach(x=>host.append(card(x)));if(!arr.length)addText(host,'div','empty','没有匹配的活动。可以调整地区或类型。');$('summary').textContent='显示 '+arr.length+' / '+events.length+' 项';$('total').textContent=events.length+' EVENTS';['region','type','sort'].forEach(k=>settings[k]=$(k).value);safeWrite(storeKey+':settings',settings);tracking();updateCount()}
$('select-visible').addEventListener('click',()=>{ordered().forEach(x=>selected.add(x.id));persist();render()});$('clear').addEventListener('click',()=>{selected.clear();persist();render()});
let toastTimer;function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,2500)}
function legacyCopy(text){const area=elem('textarea');area.value=text;area.readOnly=true;area.style.cssText='position:fixed;top:0;left:0;opacity:0;width:1px;height:1px;';document.body.append(area);area.focus();area.select();area.setSelectionRange(0,text.length);let ok=false;try{ok=document.execCommand('copy')}catch{}area.remove();return ok}
$('copy').addEventListener('click',async()=>{const names=events.filter(x=>selected.has(x.id)).map(x=>x.活动名);if(!names.length){toast('请先勾选活动');return}const text=names.join('\n');let success=false;if(navigator.clipboard&&window.isSecureContext){try{await navigator.clipboard.writeText(text);success=true}catch{}}if(!success)success=legacyCopy(text);if(success){toast('已复制 '+names.length+' 项活动名')}else{const area=elem('textarea');area.value=text;area.style.cssText='width:100%;min-height:100px;margin:10px 0';const modal=$('lightbox');$('lightbox-image').hidden=true;modal.insertBefore(area,$('lightbox-image'));modal.hidden=false;area.focus();area.select();toast('自动复制失败，请手动复制选中的文字')}});
let previousFocus=null;function openLightbox(src,alt){previousFocus=document.activeElement;$('lightbox-image').hidden=false;$('lightbox-image').src=src;$('lightbox-image').alt=alt;$('lightbox').hidden=false;document.body.style.overflow='hidden';$('close-lightbox').focus()}
function closeLightbox(){const modal=$('lightbox');modal.hidden=true;modal.querySelectorAll('textarea').forEach(x=>x.remove());$('lightbox-image').hidden=false;$('lightbox-image').removeAttribute('src');document.body.style.overflow='';if(previousFocus&&previousFocus.isConnected)previousFocus.focus()}
$('close-lightbox').addEventListener('click',closeLightbox);$('lightbox').addEventListener('click',e=>{if(e.target===$('lightbox'))closeLightbox()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('lightbox').hidden)closeLightbox()});
render();
})();
</script>
</body></html>
