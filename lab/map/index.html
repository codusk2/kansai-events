<!doctype html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>遛弯 · 地图原型</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="map.css">
</head>
<body data-style="photo">
<div id="map" class="map" aria-label="关西地图"></div>

<header class="top">
  <div class="top-bar">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" class="logo-bg"/><path d="M7 22c4.5 0 4.5-7 9-7s4.5 7 9 7" class="logo-line"/><circle cx="23.5" cy="10.5" r="2.8" class="logo-sun"/></svg>
      <b>遛弯</b>
      <span class="today num" id="today"></span>
    </div>
    <button type="button" class="proto-btn" id="proto-btn" aria-expanded="false">原型设置</button>
  </div>
  <nav class="filters" id="filters" aria-label="筛选"></nav>
  <div class="proto-panel" id="proto-panel" hidden>
    <div class="pp-row"><span>卡片</span><div class="seg" id="style-seg"></div></div>
    <div class="pp-row"><span>主题</span><div class="seg" id="theme-seg"></div></div>
    <p class="pp-note">样例数据：地点的单程、花费、最佳期未核实。图：Wikimedia Commons。</p>
  </div>
</header>

<section class="strip" id="strip" aria-label="视野里的地点">
  <div class="strip-head"><b id="strip-count"></b><span>由近到远</span></div>
  <div class="strip-list" id="strip-list"></div>
</section>

<aside class="sheet" id="sheet" aria-label="攻略" hidden></aside>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="../directions/data.js"></script>
<script src="geo.js"></script>
<script src="map.js"></script>
</body>
</html>
