<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="蟹鱼游">
<title>蟹鱼游 · 旅行点原型</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="spots.css">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="head" id="head">
      <div class="head-row">
        <div class="brand">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <rect width="32" height="32" rx="9" class="logo-bg"/>
            <path class="logo-crab" d="M6.5 14.5a4.5 4.5 0 0 1 9 0z M7 11.5c-1.6-1-1.6-3.2 0-4.2 M15 11.5c1.6-1 1.6-3.2 0-4.2"/>
            <path class="logo-fish" d="M12 22c2.6-3.4 7.6-3.4 10.2 0-2.6 3.4-7.6 3.4-10.2 0z M22.2 22l3.6-2.6v5.2z"/>
          </svg>
          <b>蟹鱼游</b>
        </div>
        <button type="button" class="filter-btn" id="filter-btn" aria-expanded="false" aria-controls="filter-pop"></button>
      </div>
      <div class="tags" id="tags" role="group" aria-label="主题"></div>
    </div>
    <div class="filter-pop" id="filter-pop" hidden>
      <div class="fp-row"><span>交通</span>
        <div class="seg" id="measure" role="group" aria-label="交通方式">
          <button type="button" data-m="transit" aria-pressed="true">🚃 公共交通</button>
          <button type="button" data-m="car" aria-pressed="false">🚗 自驾</button>
        </div>
      </div>
      <div class="fp-row"><span>单程</span><div class="seg seg-4" id="limit" role="group" aria-label="单程时间"></div></div>
      <p class="fp-legend"><span>照片外圈表示单程</span><i class="lg30"></i>半小时<i class="lg60"></i>1小时<i class="lg120"></i>2小时<i class="lg180"></i>3小时</p>
    </div>
  </header>

  <main class="views">
    <section class="view view-map" id="view-map" aria-label="地图">
      <div id="map" class="map"></div>
      <section class="deck" id="deck" aria-label="旅行点卡片">
        <div class="deck-head" id="deck-count"></div>
        <div class="deck-list" id="deck-list"></div>
      </section>
    </section>
    <section class="view view-rings" id="view-rings" aria-label="时间圈" hidden>
      <div class="rings-vp" id="rings-vp"><div class="rings-pad"><div class="rings" id="rings"></div></div></div>
      <div class="rings-zoom" id="rings-zoom"><button type="button" data-z="+" aria-label="放大">＋</button><button type="button" data-z="-" aria-label="缩小">−</button></div>
      <p class="rings-note" id="rings-note"></p>
    </section>
    <section class="view view-book" id="view-book" aria-label="画册" hidden></section>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="呈现方式">
    <button type="button" data-v="map" aria-pressed="true">地图</button>
    <button type="button" data-v="rings" aria-pressed="false">时间圈</button>
    <button type="button" data-v="book" aria-pressed="false">画册</button>
  </nav>

  <p class="hint" id="hint"><span class="hint-arrow" aria-hidden="true">↑</span>点上方的标签，开始探索</p>

  <aside class="sheet" id="sheet" aria-label="旅行点" hidden></aside>

  <section class="hello" id="hello" aria-label="欢迎" hidden>
    <div class="hello-card">
      <p class="hello-hi">Halo 天源！</p>
      <p class="hello-q">想去哪玩？</p>
      <p class="hello-tip">点击标签开始探索</p>
      <div class="hello-tags" id="hello-tags"></div>
      <p class="hello-by">—— by codusk</p>
    </div>
  </section>
  <div class="toast" id="toast" role="status" hidden></div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="spots.js"></script>
</body>
</html>
