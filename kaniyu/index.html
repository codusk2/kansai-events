<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="蟹鱼游">
<title>蟹鱼游</title>
<meta name="description" content="从大阪京桥出发，按单程时间找关西值得去的地方。">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#F3F9FE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101821" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="spots.css">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="head" id="head">
      <div class="head-row">
        <div class="brand">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <rect width="32" height="32" rx="9" class="logo-bg"/>
            <path class="logo-crab" d="M6.5 14.5a4.5 4.5 0 0 1 9 0z M7 11.5c-1.6-1-1.6-3.2 0-4.2 M15 11.5c1.6-1 1.6-3.2 0-4.2"/>
            <path class="logo-fish" d="M12 22c2.6-3.4 7.6-3.4 10.2 0-2.6 3.4-7.6 3.4-10.2 0z M22.2 22l3.6-2.6v5.2z"/>
          </svg>
          <b>蟹鱼游</b>
        </div>
        <button type="button" class="filter-btn" id="filter-btn" aria-expanded="false" aria-controls="filter-pop"></button>
      </div>
      <div class="tags-row">
        <div class="tags" id="tags" role="group" aria-label="主题"></div>
        <button type="button" class="tags-more" id="tags-more" aria-expanded="false" aria-controls="tag-panel" aria-label="展开全部标签"></button>
      </div>
    </div>
    <div class="tag-panel" id="tag-panel" hidden>
      <div class="tp-head"><span id="tag-panel-count"></span>
        <span class="tp-acts"><button type="button" data-act="all">全选</button><button type="button" data-act="none">清空</button><button type="button" data-act="done" class="tp-done">完成</button></span>
      </div>
      <div class="tp-grid" id="tag-grid"></div>
      <p class="tp-note"><span class="critters-slot"></span>标签是“或”：符合任何一个选中的标签都会显示。</p>
    </div>
    <div class="filter-pop" id="filter-pop" hidden>
      <div class="fp-row"><span>交通</span>
        <div class="seg" id="measure" role="group" aria-label="交通方式">
          <button type="button" data-m="transit" aria-pressed="true">🚃 公共交通</button>
          <button type="button" data-m="car" aria-pressed="false">🚗 自驾</button>
        </div>
      </div>
      <div class="fp-row"><span>单程</span><div class="seg seg-4" id="limit" role="group" aria-label="单程时间"></div></div>
      <p class="fp-legend"><span>照片外圈表示单程</span><i class="lg30"></i>半小时<i class="lg60"></i>1小时<i class="lg120"></i>2小时<i class="lg180"></i>3小时</p>
    </div>
  </header>

  <main class="views">
    <section class="view view-map" id="view-map" aria-label="地图">
      <div id="map" class="map"></div>
      <p class="map-credit">© <a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> · <a href="https://www.openmaptiles.org/" target="_blank" rel="noopener">OpenMapTiles</a> · <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></p>
      <div class="map-ctrl">
        <button type="button" class="mc-btn ga" id="ga-btn" aria-pressed="false"></button>
        <button type="button" class="mc-btn" id="ev-btn" aria-pressed="false"></button>
        <button type="button" class="mc-btn" id="home-btn" aria-label="回到京桥站">📍 京桥</button>
      </div>
      <section class="deck" id="deck" aria-label="旅行点卡片">
        <button type="button" class="deck-head" id="deck-toggle" aria-expanded="true" aria-controls="deck-list"><span id="deck-count"></span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg></button>
        <div class="deck-list" id="deck-list"></div>
      </section>
    </section>
    <section class="view view-rings" id="view-rings" aria-label="时间圈" hidden>
      <div class="radar-wrap" id="radar-wrap"><div class="radar" id="radar"></div></div>
      <button type="button" class="radar-fit" id="radar-fit">⤢ 全图</button>
    </section>
    <section class="view view-book" id="view-book" aria-label="画册" hidden></section>
    <section class="view view-wish" id="view-wish" aria-label="想去的" hidden></section>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="呈现方式">
    <button type="button" data-v="map" aria-pressed="true">地图</button>
    <button type="button" data-v="rings" aria-pressed="false">时间圈</button>
    <button type="button" data-v="book" aria-pressed="false">画册</button>
    <button type="button" data-v="wish" aria-pressed="false" id="wish-tab">想去的</button>
  </nav>

  <p class="hint" id="hint"><span class="hint-arrow" aria-hidden="true">↑</span>点上方的标签开始探索，或看看🎟️活动<span class="critters-slot"></span></p>

  <aside class="sheet" id="sheet" aria-label="旅行点" hidden></aside>

  <section class="hello" id="hello" aria-label="欢迎" hidden>
    <button type="button" class="hello-x" id="hello-x" aria-label="跳过">×</button>
    <div class="hello-card" id="hello-step1">
      <p class="hello-hi">Halo 天源！</p>
      <p class="hello-q">来瞅瞅，有啥得劲嘞地方没！</p>
      <p class="hello-tip">先说说咋去、最远跑多久</p>
      <div class="hello-seg" id="hello-measure"></div>
      <div class="hello-seg hello-limit" id="hello-limit"></div>
      <button type="button" class="hello-btn" id="hello-next">下一步：选标签</button>
      <p class="hello-by"><span class="critters-slot"></span>—— by codusk</p>
    </div>
    <div class="hello-card" id="hello-step2" hidden>
      <p class="hello-q">感兴趣啥样的地方？</p>
      <p class="hello-tip">至少选三个，符合任何一个的都会出现</p>
      <div class="hello-tags" id="hello-tags"></div>
      <div class="hello-foot"><button type="button" class="hello-back" id="hello-back">上一步</button><button type="button" class="hello-btn" id="hello-go" disabled></button></div>
    </div>
  </section>
  <div class="toast" id="toast" role="status" hidden></div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="spots.js"></script>
</body>
</html>
