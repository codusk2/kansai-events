<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 蟹鱼游：沉静的蓝底，白色随笔线条画一只小螃蟹和一条小鱼，左下一道浪 -->
  <rect width="64" height="64" rx="15" fill="#5A8FC2"/>
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- 螃蟹：半圆的壳、举起的两只钳子、眼柄、四条细腿 -->
    <path d="M17 30c.4-5.8 4.6-9.6 10-9.6s9.6 3.8 10 9.6c-6.6.7-13.3.7-20 0z" fill="#FFFFFF" stroke-width="1.6"/>
    <path d="M18.6 24.2l-4.1-5.2M35.4 24.2l4.1-5.2" stroke-width="2.2"/>
    <path d="M14.5 19c-1.8-.6-2.8-2.2-2.7-4M14.5 19c.9-1.4 1.1-3 .6-4.6" stroke-width="2.2"/>
    <path d="M39.5 19c1.8-.6 2.8-2.2 2.7-4M39.5 19c-.9-1.4-1.1-3-.6-4.6" stroke-width="2.2"/>
    <path d="M24.2 21l-.7-3.4M29.8 21l.7-3.4" stroke-width="1.8"/>
    <path d="M18.2 30.3l-2.7 2.9M21.4 30.8l-1.3 3.1M32.6 30.8l1.3 3.1M35.8 30.3l2.7 2.9" stroke-width="1.6"/>
    <!-- 浪 -->
    <path d="M11 50c3-2.3 5.9-2.3 8.9 0s5.9 2.3 8.9 0" stroke-width="1.8" opacity=".7"/>
    <!-- 小鱼和两个泡泡 -->
    <path d="M33 45c3.4-4.4 10-5 14.4-.4-4.2 4.8-11 4.4-14.4.4z" stroke-width="2"/>
    <path d="M47.4 44.8l5.2-3.4-.9 3.6 1 3.8z" stroke-width="2"/>
    <circle cx="30.6" cy="40" r="1.1" stroke-width="1.2" opacity=".8"/>
    <circle cx="28.6" cy="37.3" r=".7" stroke-width="1" opacity=".6"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="23.4" cy="17.2" r="1.5"/>
    <circle cx="30.6" cy="17.2" r="1.5"/>
    <circle cx="37.6" cy="44.2" r=".95"/>
  </g>
</svg>
